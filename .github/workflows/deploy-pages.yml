name: 部署消防栓地圖

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [同步消防栓資料]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify data privacy and deployment boundaries
        run: python3 -m unittest discover -s tests -v
      - name: Package public assets and inject restricted browser keys
        env:
          CARTO_BASEMAP_API_KEY: ${{ secrets.CARTO_BASEMAP_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python3 scripts/build_site.py "$RUNNER_TEMP/hydrant-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/hydrant-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
